<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crear cultivo</title>
		<link rel="stylesheet" href="../css/pages/forms.css" />
		<link rel="shortcut icon" href="../imgs/logoSena.svg" type="image/x-icon" />
		<script type="module" src="../js/pages/componentLoader.js"></script>
		<link rel="stylesheet" href="../css/components/header.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>
	</head>

	<body>
		<header class="header" data-title="Crear cultivo"></header>

		<main class="main-content">
			<div class="form form--height">
				<div class="form__back-link">
					<a href="listar-cultivos.html" class="button--back">← Volver</a>
				</div>

				<h2 class="form__title">Creación del cultivo</h2>

				<form class="form__container" method="post">
					<div class="form__row">
						<div class="form__group">
							<label for="nombre" class="form__label">Nombre</label>
							<input
								class="form__input form__input--cultive-name"
								placeholder="Ingrese nombre del cultivo"
								required
							/>
						</div>
						<div class="form__group">
							<label for="tipo" class="form__label">Tipo de cultivo</label>
							<select class="form__select form__input--cultive-type" required>
								<option value="">Seleccionar tipo de cultivo</option>
								<option value="Hortalizas">Hortalizas</option>
								<option value="Tuberculos">Tubérculos</option>
								<option value="Cereales">Cereales</option>
								<option value="Leguminosas">Leguminosas</option>
								<option value="Frutas">Frutas</option>
								<option value="Oleaginosas">Oleaginosas</option>
								<option value="Forrajeras">Forrajeras</option>
								<option value="Otros">Otros</option>
							</select>
						</div>
					</div>

					<div class="form__group">
						<label for="imagen" class="form__label">Imagen</label>
						<input
							type="file"
							class="form__file form__file--cultive-image"
							accept=".jpg, .jpeg, .png"
							required
						/>
					</div>

					<div class="form__row">
						
						<div class="form__group">
							<label for="ubicacion" class="form__label">Ubicación</label>
							<select class="form__select form__input--cultive-location" required>
								<option value="">Seleccionar ubicación</option>
								<option value="Invernadero Norte">Invernadero Norte</option>
								<option value="Invernadero Sur">Invernadero Sur</option>
								<option value="Campo Abierto A">Campo Abierto A</option>
								<option value="Campo Abierto B">Campo Abierto B</option>
								<option value="Hidroponico A">Hidropónico A</option>
								<option value="Hidroponico B">Hidropónico B</option>
								<option value="Terraza">Terraza</option>
								<option value="Interior">Interior</option>
								<option value="Otros">Otros</option>
							</select>
						</div>
					</div>
					<div class="form__group form__group--full-width">
						<label for="tamano" class="form__label">Tamaño</label>
						<input
							type="number"
							class="form__input form__input--cultive-size"
							placeholder="Ingrese el tamaño del cultivo en m2"
							required
						/>
					</div>
					<div class="form__group form__group--full-width">
						<label class="form__label">Descripción</label>
						<textarea
							class="form__textarea form__textarea--cultive-description"
							placeholder="Ingrese descripción del cultivo"
							maxlength="500"
							required
						></textarea>
						<div class="char-counter" style="text-align: right; font-size: 0.875rem; color: #666; margin-top: 0.25rem;">
							<span class="char-count" style="font-weight: 600; color: #27ae60;">0</span>/500 caracteres
						</div>
					</div>

					<div class="form__group--full-width">
						<div class="status-container">
							<div class="status-item">
								<input
									type="radio"
									name="estado-habilitado"
									value="habilitado"
									checked
								/>
								Habilitado
							</div>
							<div class="status-item">
								<input
									type="radio"
									name="estado-habilitado"
									value="deshabilitado"
								/>
								Deshabilitado
							</div>
						</div>
					</div>

					<div class="form__button-container">
						<button type="submit" class="button button--submit">
							Crear cultivo
						</button>
					</div>
				</form>
			</div>
			<!-- Toast para notificaciones -->
			<div id="toast" class="toast hidden">
				<div class="toast-content">
					<i id="toastIcon" class="fas fa-check-circle"></i>
					<div class="toast-message">
						<span id="toastTitle" class="toast-title"></span>
						<span id="toastDescription" class="toast-description"></span>
					</div>
				</div>
				<div class="toast-progress"></div>
			</div>
		</main>

		<script src="../js/validations/cropCreationValidator.js"></script>
		<!-- Script para verificar autenticación antes demostrar la vista -->
		<script src="../js/utils/auth-check.js"></script>

		<script>
			// Contador de caracteres para la descripción
			document.addEventListener('DOMContentLoaded', function() {
				const textarea = document.querySelector('.form__textarea--cultive-description');
				const charCount = document.querySelector('.char-count');

				if (textarea && charCount) {
					textarea.addEventListener('input', function() {
						const currentLength = this.value.length;
						charCount.textContent = currentLength;

						// Cambiar color si se acerca al límite
						if (currentLength > 450) {
							charCount.style.color = '#e74c3c'; // Rojo
						} else if (currentLength > 400) {
							charCount.style.color = '#f39c12'; // Naranja
						} else {
							charCount.style.color = '#27ae60'; // Verde
						}
					});
				}
			});
		</script>
	</body>
</html>
