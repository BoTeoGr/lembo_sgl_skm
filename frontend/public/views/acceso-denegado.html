<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Acceso denegado</title>
		<link rel="shortcut icon" href="../imgs/logoSena.svg" type="image/x-icon" />
		<link rel="stylesheet" href="../css/pages/listar.css" />
		<link rel="stylesheet" href="../css/components/navbar.css" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400"
		/>
		<style>
			html,
			body {
				height: 100%;
			}
            
			:root {
				--accent: #22c55e;
				--danger: #ef4444;
				--muted: #6b7280;
			}
			.denied {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
			}
			.denied__main {
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: radial-gradient(
						1200px 600px at 10% 0%,
						rgba(34, 197, 94, 0.07),
						transparent
					),
					radial-gradient(
						1000px 500px at 90% 100%,
						rgba(14, 165, 233, 0.06),
						transparent
					),
					#f8fafc;
			}
			.nav-render {
				display: none;
			}
			.denied__card {
				background: #ffffff;
				border: 1px solid #e5e7eb;
				border-radius: 14px;
				padding: 28px;
				max-width: 560px;
				width: 100%;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
				text-align: center;
			}
			.denied__icon {
				width: 68px;
				height: 68px;
				border-radius: 50%;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				margin-bottom: 12px;
				background: color-mix(in srgb, var(--danger) 12%, white);
				color: var(--danger);
				border: 1px solid color-mix(in srgb, var(--danger) 30%, white);
				animation: pop 0.4s ease-out both;
			}
			.material-symbols-outlined {
				font-size: 34px;
			}
			@keyframes pop {
				from {
					transform: scale(0.85);
					opacity: 0.6;
				}
				to {
					transform: scale(1);
					opacity: 1;
				}
			}
			.denied__title {
				margin: 8px 0 6px;
				font-size: 1.75rem;
				color: #0f172a;
				font-weight: 800;
				letter-spacing: 0.2px;
			}
			.denied__subtitle {
				color: var(--muted);
				margin-bottom: 18px;
				line-height: 1.45;
			}
			.denied__actions {
				display: flex;
				gap: 12px;
				justify-content: center;
				flex-wrap: wrap;
			}
			.btn {
				appearance: none;
				-webkit-appearance: none;
				border: 1px solid #e5e7eb;
				background: #fff;
				color: #0f172a;
				border-radius: 10px;
				cursor: pointer;
				transition: box-shadow 0.2s, transform 0.05s, background-color 0.2s;
				text-decoration: none;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				height: 42px;
				padding: 0 14px;
				line-height: 1;
				font-weight: 500;
				box-sizing: border-box;
			}
			.btn:focus-visible {
				outline: 3px solid rgba(34, 197, 94, 0.35);
				outline-offset: 2px;
			}
			.btn:hover {
				box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
				background: #f9fafb;
			}
			.btn:active {
				transform: translateY(1px);
			}
			.btn--primary {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			.btn--primary:hover {
				filter: brightness(0.98);
				box-shadow: 0 8px 18px rgba(34, 197, 94, 0.25);
				background: color-mix(in srgb, var(--accent) 92%, white);
			}
			.denied__meta {
				margin-top: 14px;
				font-size: 0.92rem;
				color: #9ca3af;
			}
			@media (max-width: 520px) {
				.denied__card {
					padding: 22px;
					border-radius: 12px;
				}
				.denied__title {
					font-size: 1.35rem;
				}
				.denied__icon {
					width: 58px;
					height: 58px;
				}
			}
		</style>
	</head>
	<body>
		<nav class="nav-render"></nav>
		<div class="denied">
			<main class="denied__main">
				<section class="denied__card" role="alert" aria-live="polite">
					<div class="denied__icon" aria-hidden="true">
						<span class="material-symbols-outlined">block</span>
					</div>
					<h1 class="denied__title">Acceso denegado</h1>
					<p class="denied__subtitle">
						No tienes permisos para ver esta página o tu sesión no está activa.
					</p>
					<div class="denied__actions">
						<a id="goBackLink" href="#" class="btn">Volver</a>
						<a href="home.html" class="btn">Ir al inicio</a>
						<a href="index.html" class="btn btn--primary">Iniciar sesión</a>
					</div>
					<div class="denied__meta" id="reasonText"></div>
				</section>
			</main>
		</div>
		<script>
			(function () {
				const back = document.getElementById("goBackLink");
				if (back)
					back.addEventListener("click", (e) => {
						e.preventDefault();
						window.history.length > 1
							? window.history.back()
							: (window.location.href = "home.html");
					});
				try {
					const params = new URLSearchParams(window.location.search);
					const reason = params.get("r");
					const map = {
						unauth: "Sesión no iniciada",
						role: "Rol insuficiente",
						route: "Ruta no permitida",
					};
					const text = reason && map[reason] ? map[reason] : "";
					if (text)
						document.getElementById(
							"reasonText"
						).textContent = `Motivo: ${text}`;
				} catch (_) {}
			})();
		</script>
	</body>
</html>
