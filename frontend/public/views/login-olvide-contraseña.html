<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100;400;700" rel="stylesheet" />
	<title>Olvidé mi contraseña</title>
	<link rel="shortcut icon" href="../imgs/logoSena.svg" type="image/x-icon" />
	<link rel="stylesheet" href="../css/pages/log.css" />
	<link rel="stylesheet" href="../css/components/toast.css" />
</head>

<body>
	<div class="layout">
		<main class="layout__main main main--forget">
			<section class="main__login login login--forget">
				<header class="login__header">
					<h2 class="login__title">
						A tu correo se enviará un código para que recuperes tu contraseña
					</h2>
				</header>
				<form class="login__form form form--forget">
					<div class="form__group">
						<input
							type="email"
							placeholder="Correo electrónico"
							class="form__input"
							id="emailRecuperar"
						/>
					</div>
					<div class="form__actions">
						<button class="form__button" type="submit">Enviar código</button>
					</div>
				</form>
			</section>
		</main>

		<aside class="layout__aside aside">
			<img src="../imgs/sgal.jpeg" alt="Logo SGAL" class="aside__logo" />
		</aside>
	</div>

	<div id="toast-container" class="toast-container"></div>

	<script>
		// Función para mostrar notificaciones toast
		function showToast(message, type = 'info') {
			const toastContainer = document.getElementById('toast-container');
			const toast = document.createElement('div');
			toast.className = `toast ${type}`;
			
			// Crear el contenido del toast
			toast.innerHTML = `
				<div class="toast-message">${message}</div>
				<button class="toast-close" aria-label="Cerrar">&times;</button>
			`;

			// Agregar el toast al contenedor
			toastContainer.prepend(toast);

			// Forzar el reflow para que la animación funcione
			void toast.offsetWidth;

			// Mostrar el toast con animación
			setTimeout(() => {
				toast.classList.add('show');
			}, 10);

			// Configurar el cierre automático
			const autoRemove = setTimeout(() => {
				toast.classList.add('slide-out');
				setTimeout(() => toast.remove(), 300);
			}, 5000);

			// Cerrar al hacer clic en el botón
			const closeButton = toast.querySelector('.toast-close');
			closeButton.addEventListener('click', () => {
				clearTimeout(autoRemove);
				toast.classList.add('slide-out');
				setTimeout(() => toast.remove(), 300);
			});

			return toast;
		}

		// Hacer la función global para que sea accesible desde otros scripts
		window.showToast = showToast;
	</script>

	<script src="../js/validations/passwordRecoveryValidator.js"></script>
</body>
</html>
